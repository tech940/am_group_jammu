        - generic [ref=f5e527]:
          - paragraph [ref=f5e528]: AM Group is one of Jammu & Kashmir's longest-running automotive groups, trading since 1968. We currently have 29 certified pre-owned cars available in Jammu, covering Hyundai, Kia, MARUTI SUZUKI, Chevrolet and MAHINDRA. Prices start from ₹80K and go up to ₹19.80 L, with model years spanning 2011 to 2025.
          - paragraph [ref=f5e529]: Every car listed here is a real unit physically in stock — the photographs are of the actual vehicle, and the odometer reading shown is the reading recorded at intake. You can browse by body style (SUV, Hatchback, Compact SUV, Premium Hatchback, Sedan, MPV and Premium SUV), by fuel type (Gasoline or Diesel), by budget, by model year, or by kilometres driven.
        - generic [ref=f5e531]:
          - article [ref=f5e532]:
            - heading "Buying a used car in Jammu" [level=2] [ref=f5e533]
            - paragraph [ref=f5e534]: A used car in Jammu has to cope with everything from city traffic to long climbs on the national highway, so mechanical condition matters more here than the badge on the bonnet. Before a car reaches this page it is inspected, its paperwork is verified, and its service history is checked where available. We publish the asking price against the original listed price so you can see exactly how a vehicle has been valued, and there is no obligation to arrange finance through us.
          - article [ref=f5e535]:
            - heading "What to check before you buy" [level=2] [ref=f5e536]
            - paragraph [ref=f5e537]: Ask to see the registration certificate, the insurance status and the pollution certificate, and confirm whether the car has ever been transferred between states — a J&K registration transferred from another state carries extra paperwork. Take the car up an incline to listen to the engine under load, check tyre wear across all four corners, and test every electrical item. Our team will walk you through each of these on any car listed here, and you are welcome to bring your own mechanic.
          - article [ref=f5e538]:
            - heading "Finance, exchange and paperwork" [level=2] [ref=f5e539]
            - paragraph [ref=f5e540]: We work with leading nationalised and private banks to arrange finance, and we handle the RC transfer, insurance transfer and hypothecation paperwork in-house. If you are part-exchanging, we will value your existing car at the showroom while you wait. Visit us at AM Business Park, N-H 1 Bye-Pass Road, opposite the railway station in Jammu, or at AM Tower, Hyderpora Bye-Pass in Srinagar.
        - generic [ref=f5e542]:
          - heading "Frequently Asked Questions" [level=2] [ref=f5e543]
          - paragraph [ref=f5e544]: Answers to the questions we are asked most often about buying a used car from AM Group Jammu.
